<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Local ChatGPT</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>My Local AI</h2>
            </div>

            <button class="new-chat-btn" onclick="newChat()">
                + 새 채팅
            </button>

            <div class="chat-history" id="chatHistory">
                <!-- 나중에 대화 목록이 들어갈 곳 -->
            </div>

            <div class="sidebar-footer">
                <span>Powered by</span>
                <strong>Llama 3.1 8B</strong>
            </div>

        </aside>


        <!-- Main -->
        <main class="main">

            <!-- Header -->
            <header class="header">

                <div>
                    <h1>My Local AI</h1>
                    <span class="model-name">
                        llama3.1:8b · Local
                    </span>
                </div>

                <button class="settings-btn">
                    ⚙
                </button>

            </header>


            <!-- Chat -->
            <section class="chat-container" id="chat">

                <div class="welcome">

                    <div class="welcome-icon">
                        🤖
                    </div>

                    <h2>무엇을 도와드릴까요?</h2>

                    <p>
                        이 AI는 여러분의 PC에서 실행되는
                        로컬 LLM입니다.
                    </p>

                </div>

            </section>


            <!-- Input -->
      <div class="input-area">

    <div
        id="filePreview"
        class="file-preview hidden"
    >
    </div>

    <div class="input-wrapper">

        <button
            id="fileButton"
            class="file-button"
            type="button"
            title="PDF 첨부"
        >
            📎
        </button>

        <input
            id="fileInput"
            type="file"
            accept=".pdf,application/pdf"
            hidden
        >

        <textarea
            id="message"
            placeholder="메시지를 입력하세요..."
            rows="1"
        ></textarea>

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

    <div class="input-info">
        Enter로 전송 · Shift + Enter로 줄바꿈
    </div>

</div>

        </main>

    </div>

    <div class="modal-backdrop hidden" id="renameModal">
        <div class="modal">
            <h2>채팅 제목 수정</h2>

            <input
                id="renameInput"
                class="modal-input"
                type="text"
                maxlength="100"
                placeholder="새 제목을 입력하세요"
            >

            <p class="modal-error hidden" id="renameError">
                제목을 입력해주세요.
            </p>

            <div class="modal-actions">
                <button class="modal-button secondary" id="renameCancelButton">
                    취소
                </button>

                <button class="modal-button primary" id="renameSaveButton">
                    저장
                </button>
            </div>
        </div>
    </div>

    <script src="/static/marked.min.js"></script>
    <script src="/static/app.js"></script>

</body>

</html>
